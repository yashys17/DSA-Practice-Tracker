```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Practice Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>DSA Practice Tracker</h1>
            <p>Track your coding journey and progress.</p>

            <!-- Dark Mode Button -->
            <button id="themeBtn">
                🌙 Dark Mode
            </button>
        </header>

        <!-- Statistics Cards -->
        <section class="stats-container">

            <div class="card">
                <h3>Total Problems</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Easy</h3>
                <h2 id="easy">0</h2>
            </div>

            <div class="card">
                <h3>Medium</h3>
                <h2 id="medium">0</h2>
            </div>

            <div class="card">
                <h3>Hard</h3>
                <h2 id="hard">0</h2>
            </div>

        </section>

        <!-- Add Problem Form -->
        <section class="form-section">

            <h2>Add New Problem</h2>

            <input
            type="text"
            id="title"
            placeholder="Problem Title">

            <input
            type="text"
            id="topic"
            placeholder="Topic">

            <select id="difficulty">
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
            </select>

            <select id="platform">
                <option>LeetCode</option>
                <option>GeeksforGeeks</option>
                <option>CodeChef</option>
                <option>CodeStudio</option>
                <option>HackerRank</option>
            </select>

            <button onclick="addProblem()">
                Add Problem
            </button>

        </section>

        <!-- Chart -->
        <section class="chart-section">
            <h2>Problem Statistics</h2>
            <canvas id="myChart"></canvas>
        </section>

        <!-- Problems Table -->
        <section class="problem-section">

            <h2>Solved Problems</h2>

            <!-- Search Box -->
            <input
            type="text"
            id="searchBox"
            placeholder="Search Problems..."
            onkeyup="searchProblem()">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Topic</th>
                        <th>Difficulty</th>
                        <th>Platform</th>
                    </tr>
                </thead>

                <tbody id="problemTable">

                </tbody>
            </table>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
```
