<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Practice Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>DSA Practice Tracker</h1>
            <p>Track your coding journey and progress.</p>

            <button id="themeBtn">
                🌙 Dark Mode
            </button>
        </header>

        <!-- Stats -->

        <section class="stats-container">

            <div class="card">
                <h3>Total Problems</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Easy</h3>
                <h2 id="easy">0</h2>
            </div>

            <div class="card">
                <h3>Medium</h3>
                <h2 id="medium">0</h2>
            </div>

            <div class="card">
                <h3>Hard</h3>
                <h2 id="hard">0</h2>
            </div>

            <div class="card">
    <h3>🔥 Streak</h3>
    <h2 id="streak">0</h2>
</div>

<div class="card">
    <h3>📈 Progress</h3>
    <h2 id="progress">0%</h2>
</div>

        </section>

        <!-- Chart -->

        <section class="chart-section">

            <h2>Problem Statistics</h2>

            <canvas id="myChart"></canvas>
            <br><br>

<h2>Topic Wise Distribution</h2>

<canvas id="topicChart"></canvas>

        </section>

        <!-- Problems -->

        <section class="problem-section">

            <h2>Solved Problems</h2>
            <button onclick="exportReport()">
    Export Report
</button>

<br><br>

            <input
                type="text"
                id="searchBox"
                placeholder="Search Problems..."
                onkeyup="searchProblem()">

            <select
                id="difficultyFilter"
                onchange="filterProblems()">

                <option value="All">All Difficulties</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>

            </select>

            <select
                id="platformFilter"
                onchange="filterProblems()">

                <option value="All">All Platforms</option>
                <option value="LeetCode">LeetCode</option>
                <option value="GeeksforGeeks">GeeksforGeeks</option>
                <option value="CodeChef">CodeChef</option>
                <option value="CodeStudio">CodeStudio</option>
                <option value="HackerRank">HackerRank</option>

            </select>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Title</th>
                        <th>Topic</th>
                        <th>Difficulty</th>
                        <th>Platform</th>
                        <th>Status</th>
                        <th>Link</th>
                        <th>Notes</th>
                        <th>Date Solved</th>

                    </tr>

                </thead>

                <tbody id="problemTable">

                </tbody>

            </table>

        </section>

    </div>

    <!-- Notes Modal -->

    <div id="notesModal" class="modal">

        <div class="modal-content">

            <span
                class="close"
                onclick="closeNotes()">

                &times;

            </span>

            <h2>Problem Notes</h2>

            <p id="noteText"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
